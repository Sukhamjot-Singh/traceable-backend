name: Test code-scan
on:
  workflow_dispatch:

jobs:
  code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover APIs from source
        uses: Traceableai/ast-action/code-scan@APIST-2128-code-scan-docker
        with:
          code_path: .
          client_scan_token: ${{ secrets.TOKEN }}
          traceable_server: api-dev.traceable.ai
          additional_cli_options: '--loglevel DEBUG'

      - name: Run DAST scan
        uses: Traceableai/ast-action/queue-scan@v2
        with:
          scan_name: traceable-backend-repo-scan
          runner_ids: 'sukham-local'
          client_scan_token: ${{ secrets.TOKEN }}
          traceable_server: api-dev.traceable.ai
          wait: 'true'
          wait_timeout: '30'
          additional_cli_options: '--loglevel DEBUG'

      - name: Publish DAST report
        if: always()
        uses: Traceableai/ast-action/report@v2
        with:
          client_scan_token: ${{ secrets.TOKEN }}
          traceable_server: api-dev.traceable.ai
